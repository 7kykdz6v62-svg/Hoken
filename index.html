<style>

.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.photo{position:relative;width:max(100%,940px);line-height:0}
.photo.portrait{width:max(100%,680px)}

.pb.h{background:var(--hnd)} .pb.p{background:var(--prt)} .pb.o{background:var(--par)}
.pb.h.open{background:color-mix(in srgb,var(--hnd) 16%,transparent)}
.pb.p.open{background:color-mix(in srgb,var(--prt) 16%,transparent)}
.pb.o.open{background:color-mix(in srgb,var(--par) 16%,transparent)}
.pb.cur{outline:2px solid var(--miss);outline-offset:0}
.pb[data-n]::after{content:attr(data-n);position:absolute;top:-8px;right:-6px;background:var(--miss);color:#fff;font:700 11px/1 var(--font);padding:2px 4px;border-radius:999px;min-width:15px;text-align:center}
.off-h .pb.h,.off-p .pb.p,.off-o .pb.o{display:none}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.wrap{position:relative}
.pop{position:absolute;width:max-content;z-index:25;display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:5px 6px;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:nowrap;font-size:13px}
.pop button{appearance:none;border:0;font:inherit;cursor:pointer;border-radius:9px}
.pop .minus{background:var(--chip);color:var(--fg);font-size:17px;width:32px;height:32px;line-height:1}
.pop .cnt{min-width:3.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pop .miss{background:var(--miss);color:#fff;font-weight:700;font-size:14px;padding:0 12px;height:32px}
.pop button:disabled{opacity:.35;cursor:default}
.pop button:focus-visible{outline:3px solid var(--prt);outline-offset:2px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sh,.pb{transition:none}}
</style>

<script>
const PAGES=[
{t:"01 健康課題の変遷（P.12）",lines:[
"# 01 日本における健康課題の変遷",
"## 1 日本における健康水準の変化",
"Q 日本の平均寿命はどのくらいだろうか？（2024年）　男性{81.09}歳　女性{87.13}歳",
"Q 世界で1番平均寿命が短い国はどこ？　{レソト王国}（約{51}歳）",
"Q 「平均寿命」と「健康寿命」をそれぞれ自分の言葉で説明してみよう！",
"~ 平均寿命：0歳児の平均余命のこと。現在生まれた子が、あと何年生きられるか。",
"~ 健康寿命：健康で暮らすことのできる期間。健康上の問題で日常生活が制限されることなく生活できる期間。",
"○ 平均寿命…（{0歳児}）の平均余命のこと。現在生まれた子が、あと何年生きられるか。",
"○ 健康寿命…健康上の問題で日常生活が（{制限}）されることなく生活できる期間。",
"○ {乳児死亡率}…年間の1000出産当たりの乳児（生後1年未満）の死亡数。（日本：{1.8}人）",
"○ [健康指標]…平均寿命、死亡率といったある集団の健康状態をはかるもの。",
"○ {健康水準}…健康指標によって示された集団の健康の程度。",
"Q 健康指標には平均寿命や死亡率のほかにどんなものがあるか？",
"日本では、乳児死亡率の低下や高齢者の死亡率の改善が平均寿命をのばしたと言われている。平均寿命が大幅にのびた現在、単なる生存期間を示す平均寿命から、日常生活動作（{ADL}）が自立した健康な期間を示す健康寿命に関心が移ってきている。",
"~ ADL：Activities of Daily living",
"Q 日本の健康寿命はどのくらいだろうか？（2022年）　男性{72.57}歳　女性{75.45}歳",
"平均寿命 − 健康寿命 ＝ 日常生活動作に支障がある期間（{不健康}な期間）",
"Q 平均寿命は男性と女性で違うのはなぜだろうか？また、男女の平均＆健康寿命の違いから、どんなメリット・デメリットが考えられるか？",
"日本の健康水準の特徴として、平均寿命・健康寿命が長いことの他に、近年では生活習慣病が多いことが挙げられる。生活習慣病の1つである糖尿病を見てみると、「糖尿病が強く疑われる者」は約（{1000}）万人と推計され、糖尿病により医療を受けている総患者数も（{552}）万人と多くなっている。",
"また、少子高齢社会における健康課題として、認知機能が低下する（{認知症}）や日常生活に介護を必要とする高齢者（{要介護者}）の人数も増加傾向にある。",
"○ {認知症}…様々な原因によって脳の神経細胞が死んでしまったり、働きが悪くなることで、記憶や判断力などの認知機能が低下し、日常生活に支障をきたす状態。",
"## 2 日本における疾病構造の変化とその要因",
"Q 日本における現在の主要死因について、順位を予想してみよう！",
"1位{悪性新生物}　2位{心疾患}　3位{老衰}　4位{脳血管疾患}　5位{肺炎}",
"## ＜日本の主要死因の変化＞",
"1950年代 … 結核をはじめとする（{感染症}）",
"1960〜70年代 … 脳血管疾患",
"1981年以降（現代）… がん（{悪性新生物}）",
"→ （{疾病構造}）が変化している",
"~ ある国の中の疾病の構造（割合）を示したもの　／　{時代とともに変化}",
"※がん、心臓病、脳卒中で死者数全体の約{4}割を占めている。",
"・（{精神疾患}）は長年にわたって入院受療率が第1位の疾患であり、現在も増加傾向にある。中でもうつ病は1990年代に比べ急増している。対策や支援が進められている。",
"Q 「うつ病」について症状や対策方法、治療法、支援の実態などについて調べてみよう！",
"## ＜生活や社会が疾病構造に与える影響＞",
"Q 感染症による死者数の減少の背景にはどんなことが考えられるだろうか？",
"・科学技術の発達と経済発展",
"・上下水道など衛生環境の改善や（{医療技術}）の発達",
"・脳血管疾患の減少には、生活様式の変化とそれによる栄養状態の改善などが影響している。",
"Q 現代社会における健康問題にはどんなものがあるか考えてみよう！",
"・長時間残業をとる労働形態や社会的ストレスによる精神疾患の増加",
"※精神疾患の中には自殺の背景となっている病気も（若者の死因第1位は{自殺}）",
"○ {生活習慣病}の増加…食事や運動、喫煙などの生活習慣が発症や進行に関与する病気。",
"例）がん、心臓病、脳卒中、糖尿病、脂質異常症、歯周病、COPDなど",
"要因）欧米型の食事などによる栄養の過多、座位中心の労働等による身体活動量の（{減少}）",
"## ＜今後の課題＞",
"・{健康寿命}の延伸　・生活習慣病の予防・重症化防止　・{精神疾患}の予防と適切な対応",
"Q 私たちには何ができるか？どうなっていくことが良いのか？"
]},
{t:"02 健康の考え方・03 ヘルスプロモーション",lines:[
"# 02 健康の考え方と成り立ち",
"## 1 健康に関する考え方",
"Q あなたはどのような状態のとき自身を「健康」と言うのだろうか？あなたは健康だろうか？",
"~ {不自由なく、元気で生きる}　{体が平和}",
"## ＜健康に関する考え方の変化＞",
"過去　結核など感染症で多くの人が死亡",
"→ 病気は命に関わるものという考えから…　健康＝（{病気}）でないこと",
"現在　健康水準の向上により疾病構造が感染症から（{慢性}疾患）へと変化",
"→ 健康に対する捉え方はより複雑となり、身体面のみでなく精神面、社会面を含む概念へと拡大",
"○ {世界保健機関}（WHO）憲章（1946年）",
"「健康とは、{身体}的、{精神}的、{社会}的に完全に良好な状態であり、たんに病気あるいは虚弱でないことではない」",
"○ 健康における3つの側面（互いに関連している）",
"・身体面：疾病や身体症状の有無／（{体力}）／抵抗力",
"・精神面：（{精神}疾患）の有無／（{ストレス}）への対処／情緒面",
"・社会面：家庭、学校、会社、地域社会などでの（{人間}関係）／社会的役割",
"⇒ 健康観の多様化（精神的な豊かさや人間関係など、生きがい、生活の質を重視する包括的な概念に）",
"○ 生活の質（{QOL}）… 人間らしく生活を送り、幸福であるかを尺度としてとらえる概念。",
"## ＜健康に対する様々な考え方＞",
"自身が持つ人生の目標を実現するために、生活の質を高める努力をしながら、生きがいを感じる生活を送ることのできる状態こそが現在の社会を生きる私たちにとっての健康と言える。",
"## 2 健康の成り立ちに関わる様々な要因",
"Q 「健康」の要因についてウェビングしてみよう！",
"○ {主体}要因 … 本人にかかわるもの",
"・生体内にある要因：年齢、（{性別}）、免疫、遺伝など",
"・（{生活習慣}）に関わる要因：身体活動・運動、食事、休養・睡眠、（{喫煙}）、飲酒など",
"○ {環境}要因 … 私たちを取り巻くもの",
"・自然環境（大気、水、土壌等の環境）",
"・経済・文化（所得、教育歴、人間関係など）",
"・保健・医療サービス（健康診断、病気やけがの治療、予防接種等）",
"# 03 ヘルスプロモーションと健康に関わる環境づくり",
"## 1 ヘルスプロモーションの考え方",
"Q そもそも「ヘルスプロモーション」って何だろうか？具体的な例まで挙げられるだろうか？",
"~ {健康のための手段}",
"定義）人々が自らの健康とその決定要因をコントロールし、（{改善}）できるようにするプロセス。",
"WHOは、「健康は日々の豊かな生活を送るための（{手段}）であり、（{目的}）ではない。そのため健康づくりに関わる組織だけでなく、あらゆる組織が取り組むものである」と強調している。",
"## ＜健康を支える環境づくり＞",
"・社会（{保障}）や社会保障制度等の整備",
"## ＜コミュニティ活動への主体的な参加＞",
"・個人の（　　　　　　）の支援　「健康情報を入手し、理解、評価して活用する力」",
"Q 「ヘルスリテラシー」とは何か？",
"~ {健康情報を入手、理解、評価して信用→生涯を通じて生活の質を維持・向上}",
"健康的な生活を1人で維持していくことは難しい。そのため、地域や学校、職場など、人々が所属するコミュニティの力を高める支援が大切。皆が協力し、誰もが健康になれる環境づくりや仕組みづくりに（{主体的}）に参加することが求められている。",
"Q あなたの住む地域におけるヘルスプロモーション活動が行われているか調べてみよう！",
"## 2 健康を守り、育てる環境",
"Q ヘルスプロモーションの根底にある考え方とは？　A.（{環境}）が健康に影響する。",
"○ 自然環境",
"・安全な（{飲水}）や食料の確保　・（自然{災害}）や地球温暖化への対策",
"○ 社会環境の整備",
"・（国民{皆}保険）や年金等の制度　・（{学校}）、企業、自治体等における取り組み",
"○ 健康格差の是正",
"・経済格差、教育格差に対する対策　・医療保険、生活保護等の制度　公助",
"・地域社会における助け合い　共助",
"Q あなたが「健康」に対して思うもしくは考える（個人 or 日本 or 世界の）課題は何か？"
]},
{t:"04 意思決定・行動選択",lines:[
"# 04 健康に関する意思決定・行動選択",
"## 1 意思決定・行動選択との関係",
"Q 最近の生活を振り返って、健康に関してどのような意思決定・行動選択をしたか？",
"私たちは日常生活において、身体活動・運動、食事、睡眠、ストレスへ対処、予防接種、不調時に受診する医療機関の選択など、健康に関わる行動について決めなければならないことが多々ある。",
"○ {意思決定}・{行動選択}…何をするかしないのか、どのようにするかといった意思を自分で決め、さまざまな選択肢から具体的な行動を選び実行すること。",
"## ＜意思決定や行動選択に影響を及ぼす要因＞",
"（個人的要因）　（社会的要因）",
"・①{知識}…授業、書籍、雑誌、経験",
"・②{価値観}…健康観、生きがい",
"・③{感情}…喜怒哀楽、面倒くさい",
"・④他者の意見や{行動}…友達、先輩、家族",
"・⑤{マスメディア}情報…SNS、TV",
"・⑥{社会}環境…運動や食環境、制度",
"~ 自分の大切に思う気持ち…「自尊感情」（セルフエスティーム）も大切",
"## 2 よりよい意思決定・行動選択の方法",
"Q 意思決定・行動選択をする上でどのようなステップを踏むか？教科書から7つ書き出し、それぞれのステップで大切なこと、意識すべきことを書いてみよう！",
"・①課題の把握",
"・②{情報}の収集 … {選択肢を列挙するために必要な情報を様々な方法で収集する「信頼の置ける情報源から」}",
"・③{選択肢}の列挙 … {できるだけたくさん！}",
"・④{結果}の予測 … {価値観と照らし合わせて判断}",
"・⑤実行{計画}の検討 … {適宜①②③に戻る。}",
"・⑥実行 … {工夫・マイナスの対応策}",
"・⑦{評価} …",
"○ R-PDCAサイクル … R{esearch}（把握）― P{lan}（計画）　Do（実行）　C{heck}（評価）　A{ction}（改善）",
"Q より良い意思決定・行動選択をするために、どんな力や能力が必要もしくは大切だと思うか？",
"・幅広い知識とともに信頼できる情報か確かめる。（時には{批判}的に考えることで信頼性の検討する）",
"・自分1人で行うことが難しい場合は、周囲の人や専門家の支援を受けることも役立つ。",
"※周囲の人から自分が望まない選択肢を選ぶように求められ、断りにくい時もある…",
"⇒適切な（{コミュニケーション}）を試みて自身の考えを主張することが大切。",
"## ＜情報の信頼性の確かめ方＞",
"・か：書いたのは誰か？発信しているのは誰か？",
"・ち：違う情報と比べたか？",
"・も：元ネタは何か？",
"・な：何のための情報か？",
"・い：いつの情報か？"
]},
{t:"05 感染症の問題・06 感染症の予防",lines:[
"# 05 現代における感染症の問題",
"## 1 時代や地域で変化する感染症",
"Q よく知っている疾患を挙げてみよう！感染するものとそうでないものに分けてみよう！",
"○ 感染症…（{病原体}）が他の人や動物などからその人の体のなかに入り、それが体内で（{増殖}）することで起こる疾患。感染症を引き起こす微生物などで、（{細菌}）や（{ウイルス}）が代表的である。",
"・{潜伏期間}…感染から発病までの期間（インフルエンザは{1}〜{3}日、麻しんは{10}〜{12}日程度である）",
"感染しても発病しない（不顕性感染）、感染力や感染する割合にも違いがある。",
"（1人の感染者から生じる二次感染者はインフルが約{2}人、麻しんは{10}人を超えるとされている）",
"Q 現在、世界の死因のうち感染症で亡くなる人は何割ぐらいいるだろうか？　A.{2}割",
"⇒ 世界ではまだ感染症で苦しんでいる国（低所得国）や地域があったり、日本でも新たな感染症が出現したりして、感染症は、まだ（{終わっていない}）ない問題であるということが分かる。",
"## 2 現在、特に問題となっている感染症",
"○ {新興感染症}…腸管出血性大腸菌感染症やエボラ出血熱のように、最近新たに認知され、問題となっている感染症。（主に{1970}年以降に発生したもの）",
"Q 新興感染症の特徴や問題点について考えてみよう！",
"## ＜新興感染症が出現する要因＞",
"・病原体の（{突然変異}）　・資源開発による熱帯地方への進出　・熱帯林伐採による自然環境の激変",
"⇒ 病原体の毒性や（{感染力}）が変化して人に感染／（{野生動物}）と人の距離が近くなった",
"## ＜問題点＞",
"・発生直後は原因や感染経路が未解明（多様）　・診断、治療法が確立していない",
"⇒（{免疫}）を持っていないため、大流行の危険性が高い／医療（特に予防）が困難",
"※2019年12月に中国で初めて報告された（{新型コロナウイルス}）は、翌1月に日本でも患者が確認され、3月にWHOが（{パンデミック}（全世界的大流行））を宣言、世界中で多くの感染者や死亡者を出し、社会経済にも大きな影響を与えた。",
"○ {再興感染症}…結核やマラリアなどのように、その発生が一時期は減少し、あまり問題にならない程度になっていたが、近年再び増加し、問題となっている感染症。",
"○ {結核}…かつては日本人の死亡原因の第1位だったが、医薬品による適切な治療、（{予防接種}）、生活水準の向上による栄養状態や衛生状態の改善により減少。しかし先進国の中では届出率が高い状態が続いている。（日本は結核と診断された患者が10万人当たり{8.2}人）",
"Q なぜ結核などの再興感染症は、再び感染が増加したのだろうか？",
"## ＜再興感染症の要因・問題点＞",
"~ {・関心の低下に伴う初期対応の遅れ}",
"・（{予防接種率}）の低下や感染機会の減少 ⇒ 人間のその感染症に対する免疫低下",
"・治療の過程で医薬品に対して抵抗力を持つ菌やウイルス（{薬剤耐性菌}・薬剤耐性ウイルス）の出現 ⇒ 抗生物質が効かない",
"・地球温暖化 ⇒ 熱帯の動物が北上し、熱帯地域にしか存在しなかった感染症が温帯地域へ侵入",
"## ＜グローバル化による課題＞",
"・（{航空網}）等の交通網の発達により一部の地域だけだった感染症も短期間で世界的な流行へと拡大",
"⇒ 世界的な協力体制：情報共有、対策が必要",
"⇒ 常に備え、早期発見、情報発信、速やかな対策が重要",
"Q 自身が行ってみたい国はどこか？またその国、地域で流行している感染症があるか調べよう！",
"~ {シンガポール…インフル・デング熱・COVID19・胃腸炎・呼吸器感染症}　←テスト外！！",
"# 06 感染症の予防",
"## 1 感染症予防の三原則",
"（{感染源}）→（{感染経路}）→（{感受性者}）",
"・感染源（病原体をもち、感染の源になるものこと）：感染症にかかっている人間や動物、昆虫／病原体に汚染された食品、水、土壌",
"・感染経路：接触、経口感染／飛沫、飛沫核感染／血液、母子感染",
"・感受性者：人間／動物、植物、昆虫",
"## ＜感染の防止＞",
"○ {感染源}対策…感染源を特定し、消毒や殺菌により病原体を排除すること",
"（例：{消毒・殺菌・感染者の適切な治療}）",
"○ {感染経路}対策…病原体が体のなかに入らないようにすること。",
"（例：{手洗い、周りの人が離れる、換気、人混みを避ける…}）",
"○ {感受性者}対策…病原体が体のなかで増えないようにすること。抵抗力の増強",
"（例：{「免疫」←十分な休養・食事・予防接種}）",
"○ 免疫（病原体が体のなかに入ってきたときに、これを排除するしくみ）",
"・{自然免疫}…細菌やウイルスなどへの感染や予防接種の経験がないにもかかわらず、生まれながらにして体に備わっている感染症に対する抵抗力のこと。",
"・{獲得免疫}…毒性を弱めたりなくしたりした病原体等を前もって投与しておくことにより、その感染症に罹りにくくすることを（{予防接種}）、投与するものをワクチンと言う。"
]},
{t:"06 予防続き・07 性感染症・エイズ",lines:[
"# 06 感染症の予防（続き）",
"昆虫やダニなど動物を介して感染する場合もある。病原体を運ぶ動物を（{媒介動物}）と呼ぶ。咳やくしゃみによる水分を含んだ（{飛沫}）感染、それが蒸発した（{飛沫核}）感染が有名。新型コロナウイルスについては、それらの中間かつ両方の意味合いを含む（{エアロゾル}）感染で広がる。（{食中毒}）のように食べ物を通して病原体が体に入ることも多く、食品の衛生管理も重要。",
"Q 免疫の働きを高く維持するためにはどのような行動や状態が良いのか？",
"## 2 現代の感染症の発生予防とまん延防止のための対策",
"## ＜社会に求められること＞",
"・環境衛生の充実（上下水道の整備、食品衛生管理を適切に行う）",
"・{検疫}（国内には常在しない危険性の高い感染症の侵入を防ぐため、海港、空港などで行う防疫措置）",
"・{予防接種}の普及（流行の阻止）",
"・法律の制定（出席停止、臨時休業など）",
"・知識の普及　適切な情報発信（国立感染症研究所 感染症情報センター）・監視活動（国立感染症研究所）",
"→ 感染症に感染した患者が全国でどのくらい発生したかを調査・研究・公表等を行っている",
"## ＜個人でできること＞",
"・マスク、咳エチケット、自覚症状がある場合は無理をしない",
"・（{予防}の{三原則}）に即した対策・適切な行動をとる（情報不足、誤った情報に左右されない）",
"・新興感染症や再興感染症の流行時には、情報不足や誤った情報の流布などにより、感染症に対する過剰な反応や混乱が起こり、人権問題に発展する恐れがある",
"# 07 性感染症・エイズとその予防",
"## 1 性感染症・エイズとは",
"Q 性感染症の特徴やどの年代が罹患しやすいのかなど知っていることを書き出してみよう！",
"○ 性感染症… 主に（{性行為}）を介して広がる感染症。多くの場合、感染者の精液や膣分泌液などに含まれた病原体が性行為の際に（{粘膜}）から侵入することによって起こる。",
"~ 粘膜：体の内側、しめってる",
"Q どのような行為で感染するのか？",
"・セックス（{腟}性交）　・オーラルセックス（{口腔}性交）　・アナルセックス（{肛門}性交）",
"※ 性感染症の中には、最悪（{キス}）だけでうつる病気もある（感染は低確率）",
"Q 性感染症の危険性や問題点はどういったところか考えよう！",
"## ＜性感染症の危険性・問題点について＞",
"・たった（{1}）回の性行為でも感染する可能性がある",
"・感染しても（{自覚症状}）がない場合があるため、本人も感染したことに気づかないときがある",
"→ 気付かないうちにパートナーに感染させる、症状が（{進行}）し病状が重くなる",
"・性感染症の場合、「恥ずかしい、人に知られたくない」などの理由で、その他の感染症に罹ったと思ったら迷わず医療機関を受診する人でも、受診をためらいがち",
"Q 性感染症に罹患した場合はどこの診療科を受診するのか？　男性（{泌尿器科}）女性（{婦人科}（産科））",
"○ エイズ（{後天性免疫不全症候群}）AIDS（Acquired Immunodeficiency Syndrome）",
"（{HIV}（ヒト免疫不全ウイルス））を病原体とする性感染症。HIV感染とエイズ発病は（{別物}）。",
"HIVに感染すると少しずつ免疫が低下していき、（{日和見}感染症（健康な人は発症しないような疾患））や悪性腫瘍など様々な症状が現れた状態をエイズという。（{潜伏}期間）が長く、半年〜10年近くある。HIV感染だけでは自覚症状がほぼないため、合併症を併発して初めてエイズだということが発覚することを「{いきなり}エイズ」という。",
"・HIV … 免疫の司令塔：ヘルパーT細胞内で増殖し、免疫が機能しなくなる。",
"・エイズは特に（{男} or 女）に多い。感染経路では、（{同性}間性的接触）が多い。",
"・日本では1980年代にHIVなどに汚染された（{血液製剤}）が原因で感染が問題となった。",
"Q エイズは治せるのか？　治せる or {治せない} or その他（　　　　）",
"⇒ 先進国ではHIVに感染しても早期に治療を受けることで、通常と変わらない日常生活を送ることができる",
"## 2 性感染症・エイズの予防",
"## ＜個人の対策＞",
"・不特定多数の人と（{性行為}）をしない",
"・（{コンドーム}）を正しく利用することで粘膜どうしの直接接触を避ける",
"・感染を疑ったら検査し、治療をする ⇒ パートナーと（{一緒}）に受診する",
"## ＜社会全体がおこなう対策＞",
"・国立感染症研究所による情報提供（性感染症がいつどのように発生しているかを調査・公表）",
"・世界エイズデー（毎年{12}月{1}日）関連したイベントが開催されたりしている。",
"※ 全国の保健所で無料かつ匿名で（{HIV抗体検査}）を受けることができる",
"血液中のHIV抗体の有無を調べる検査。HIVに感染すると通常4週間後くらいから抗体が検出されるようになる。HIVに感染していても検査で陰性になる期間を「{ウィンドウピリオド}」という。",
"## ○主な性感染症（病原体）",
"・エイズ（HIV）　・{梅毒}（梅毒トレポネーマ）　・ヒトパピローマウイルス感染症（HPV）",
"・性器{クラミジア}感染症（クラミジア・トラコマティス）　・淋菌感染症（淋菌）",
"・性器ヘルペスウイルス感染症（単純ヘルペスウイルス）"
]},
{t:"08 生活習慣病・09 身体活動",lines:[
"# 08 生活習慣病の予防と回復",
"## 1 生活習慣病とは",
"Q 日本人の主な死因トップ5は何か？思い出してみよう！さらに世界の死因トップ5は何か？",
"○ 生活習慣病…年齢や遺伝的要因だけでなく、子供の頃からの運動や食事、休養・睡眠、喫煙や飲酒などの生活習慣、個人を取り巻く{社会環境}要因が発症や進行に深く関与する疾病の総称。",
"※ 国際的には（{非感染性疾患}（NCDs））に該当。個人の意識や行動だけでなく、それを取り巻く社会環境による影響も大きい。",
"## ＜調べ学習＞（症状などの特徴、種類、背景や要因、年齢人数や割合、等）",
"・悪性新生物　・虚血性心疾患　・脳血管疾患　・高血圧症　・脂質異常症　・糖尿病　・腎臓病　・歯周病",
"Q 具体的にどういった行動や習慣がどのような経緯で生活習慣病につながっていくのだろうか？",
"Q 虚血性心疾患、脳血管疾患などの循環器疾患に共通する要因は？",
"⇒（{動脈}硬化）、（　　　、　　　、　　　など）肥満が強く関連",
"○ {メタボリックシンドローム}…内臓脂肪型肥満に高血圧、脂質異常、高血糖いずれか2つを合併したもの",
"## 2 生活習慣病の予防と回復のための取り組み",
"・一次予防：健康づくり→（{罹患}率）の低下（病気になることを防ぐ）／健康的な生活習慣の実践／健康教育・予防接種など",
"・二次予防：（{早期発見}）・（{早期治療}）→（{死亡}率）の低下（病気で亡くなることを防ぐ）／健康診断・がん検診など",
"・三次予防：機能維持、機能回復→（重症化{防止}）（社会{復帰}）／治療の継続／リハビリテーション",
"Q 日本の健康診断やがん検診はどのくらいの人が受けているのだろうか？費用はどのくらい？",
"健康診断{男73.1・女65.7}％　胃がん{51}％　子宮頸がん{46}％　乳がん{51}％",
"## ＜社会的対策＞　個人ではできないこと ⇒ 人とのつながり",
"・地域とのつながり … 健康増進活動、イベント実施　例）運動指導、講演会、料理教室",
"・経済支援 … クーポン券の発行、（{ピンクリボン}活動）：乳がんの正しい知識の普及啓発",
"・社会環境整備 … 歩きやすい道路環境、職場復帰の支援、運動施設・病院の整備、禁煙対策",
"Q がん検診をはじめとした健康に関する検診の受診率はどうしたら上がるのだろうか？",
"# 09 身体活動・運動と健康",
"## 1 身体活動・運動と健康の関係",

const PORTRAIT={3:true};
const $=s=>document.querySelector(s);
const LS='hoken-sheet-v1';

function load(){try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){state.counts=s.counts||{};state.at=s.at||0;state.view=s.view||'photo';state.page=s.page||1;state.off=s.off||state.off}}catch(e){}}

let dbRef=null,dbTimer=0;
function saveDb(){state.at=Date.now();persist();if(!dbRef)return;clearTimeout(dbTimer);dbTimer=setTimeout(()=>{try{dbRef.set({counts:state.counts,at:state.at}).catch(()=>{})}catch(e){}},600)}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await window.claude.use('user');const db=await window.claude.use('db');
    const id=user?await user.id():null;if(!db||!id)return;

    dbRef.onSnapshot(s=>{clearTimeout(timer);const d=s.exists?s.data():null;
      if(d&&d.counts&&(d.at||0)>state.at){state.counts=d.counts;state.at=d.at;persist();paint()}

}
function pageCount(p){let n=0;const pre=['t'+p+'-','q'+p+'-','p'+p+'-'];for(const k in state.counts){if(pre.some(x=>k.startsWith(x)))n+=state.counts[k]}return n}
function renderChips(){

function sheet(cls,key,text,answerEl){
  const s=document.createElement('span');s.className='sh '+cls;s.dataset.key=key;s.tabIndex=0;s.setAttribute('role','button');s.textContent=text;labels[key]=text;
  s.setAttribute('aria-label','答え '+text);return s;
}
const TOK=/\{([^{}]*)\}|\[([^\[\]]*)\]|（([^（）{}\[\]]*)）/g;
function renderLine(raw,p,ctr){
  let cls='ln',txt=raw;
  if(raw.startsWith('## ')){cls+=' h2';txt=raw.slice(3)}
  else if(raw.startsWith('# ')){cls+=' h1';txt=raw.slice(2)}
  else if(raw.startsWith('Q ')){cls+=' q';txt='Q. '+raw.slice(2)}
  else if(raw.startsWith('~ ')){cls+=' m';txt=raw.slice(2)}
  else if(/^[・○→⇒※]/.test(raw)){cls+=' i'}
  const d=document.createElement('div');d.className=cls;
  let last=0,m;TOK.lastIndex=0;
  while((m=TOK.exec(txt))){
    if(m.index>last)d.appendChild(document.createTextNode(txt.slice(last,m.index)));
    if(m[1]!==undefined){d.appendChild(sheet('hnd','t'+p+'-'+(ctr.i++),m[1]))}
    else if(m[2]!==undefined){d.appendChild(sheet('prt','t'+p+'-'+(ctr.i++),m[2]))}
    else{const inner=m[3];
      if(inner.trim()===''||inner.length>40){d.appendChild(document.createTextNode(m[0]))}
      else{d.appendChild(document.createTextNode('（'));d.appendChild(sheet('par','q'+p+'-'+(ctr.j++),inner));d.appendChild(document.createTextNode('）'))}}
    last=TOK.lastIndex;
  }
  if(last<txt.length)d.appendChild(document.createTextNode(txt.slice(last)));
  return d;
}

  }else{
